<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Button · AI Planner</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}</style></head><body>
<div class="row"><button class="aip-btn">Plan my tasks</button><button class="aip-btn aip-btn--accent">+ New task</button><button class="aip-btn aip-btn--secondary">Refresh</button><button class="aip-btn aip-btn--secondary" disabled>Can't change offline</button></div>
<div class="row"><button class="aip-btn aip-btn--small">Use 5 h 30</button><button class="aip-btn aip-btn--secondary aip-btn--small">Dismiss</button></div>
<div class="row"><div class="aip-seg" role="group" aria-label="Days in view"><button aria-pressed="false">Day</button><button aria-pressed="false">3 days</button><button aria-pressed="true">Week</button></div></div>
</body></html>
