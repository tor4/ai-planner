<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Banner · AI Planner</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px} .b{display:grid;gap:10px;max-width:560px}</style></head><body><div class="b">
