<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TaskRow · AI Planner</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>body{margin:0;padding:20px;background:var(--paper);color:var(--ink);font-family:var(--font-sans)} ul{max-width:520px}</style></head><body>
<ul class="aip-tasks">
<li class="aip-task" aria-current="true"><input type="checkbox" aria-label="Mark Q3 report done"><span class="body"><span class="t">Q3 report</span><span class="m">6 h <span class="aip-tag">Important</span> due Wed 18 Nov</span></span><button class="aip-iconbtn aip-iconbtn--ghost" aria-label="More for Q3 report"><i class="ti ti-dots" aria-hidden="true"></i></button></li>
<li class="aip-task"><input type="checkbox" aria-label="Mark Call bank done"><span class="body"><span class="t">Call bank</span><span class="m">30 min <span class="aip-chip">⊘ Missed today</span></span></span><button class="aip-iconbtn aip-iconbtn--ghost" aria-label="More for Call bank"><i class="ti ti-dots" aria-hidden="true"></i></button></li>
<li class="aip-task"><input type="checkbox" aria-label="Mark Gym done"><span class="body"><span class="t">Gym</span><span class="m">repeats 3 times a week</span></span><button class="aip-iconbtn aip-iconbtn--ghost" aria-label="More for Gym"><i class="ti ti-dots" aria-hidden="true"></i></button></li>
</ul></body></html>
