<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Check in · AI Planner</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css">
<style>html,body{height:100%}.shell{display:grid;grid-template-rows:auto 1fr auto;height:100vh}main{overflow:auto;min-height:0}</style><style>main{padding:0 16px 16px;display:grid;gap:12px;align-content:start}</style></head><body class="aip-body"><a class="aip-skip" href="#main">Skip to content</a><div class="shell">
<header class="aip-toolbar aip-toolbar--compact"><h1 style="text-align:start;margin-inline-start:4px">Check in · 2 left</h1></header><main id="main">
<article class="aip-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>Call bank</h3><span class="aip-chip">⊘ Missed</span></div><p class="meta">Today · 11:30–12:15 · closes in 7 days</p><div class="aip-options" role="group" aria-label="What happened with Call bank?"><button class="aip-btn aip-btn--accent">As planned</button><button class="aip-btn aip-btn--secondary">It took X</button><button class="aip-btn aip-btn--secondary">Partly done</button><button class="aip-btn aip-btn--secondary">Didn&#39;t do it</button></div><div style="margin-top:12px"><button class="aip-btn aip-btn--secondary aip-btn--small"><i class="ti ti-plus" aria-hidden="true"></i>Add a note</button></div></article><article class="aip-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>Write report</h3><span class="aip-tag">It took X</span></div><p class="meta">Today · 09:00–10:00</p>
<div style="display:grid;gap:12px"><div class="aip-field"><label for="at">Actual time</label><input class="aip-input" id="at" value="1 h 20 min"></div>
<div class="aip-field"><label for="as">Actual start (optional)</label><input class="aip-input" id="as" type="time" value="09:10"></div>
<button class="aip-btn" style="width:100%">Save</button>
<p class="aip-note" style="font-family:var(--font-mono)">planned 1 h · real 1 h 20<br>today 6 h planned · 1 h 20 confirmed</p></div></article>
</main>
